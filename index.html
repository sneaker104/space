<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>그리드 공장 게임</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Malgun Gothic', sans-serif; background-color: #1e272e; user-select: none; }
        #gameCanvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
        
        #ui-layer { position: absolute; top: 0; right: 0; height: 100vh; display: flex; flex-direction: column; align-items: flex-end; pointer-events: none; z-index: 10; }
        #toggle-btn { pointer-events: auto; margin: 15px; padding: 12px 20px; cursor: pointer; background: #f39c12; color: white; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        #sidebar { pointer-events: auto; width: 280px; height: 100%; background: #2f3640; color: white; transform: translateX(100%); transition: transform 0.3s ease; padding: 20px; box-sizing: border-box; box-shadow: -5px 0 15px rgba(0,0,0,0.5); overflow-y: auto; display: flex; flex-direction: column; }
        #sidebar.open { transform: translateX(0); }
        
        .build-item { background: #353b48; padding: 15px; margin-bottom: 10px; cursor: pointer; border: 2px solid #718093; border-radius: 5px; display: flex; align-items: center; transition: 0.2s; }
        .build-item:hover { background: #404856; }
        .build-item.active { border-color: #4cd137; background: #44bd32; }
        .color-box { width: 20px; height: 20px; margin-right: 15px; border: 1px solid rgba(255,255,255,0.3); }

        /* 상단 버튼들 */
        .top-btn { position: absolute; top: 15px; padding: 10px 15px; background: #34495e; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 18px; z-index: 10; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.2s; pointer-events: auto; }
        .top-btn:hover { background: #2c3e50; }
        #settings-btn { left: 15px; }
        #upgrades-btn { left: 110px; background: #8e44ad; }
        #upgrades-btn:hover { background: #732d91; }

        #resource-bar { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: #2f3640; color: #f1c40f; padding: 10px 25px; border-radius: 20px; font-weight: bold; font-size: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 10; display: flex; gap: 20px; pointer-events: none; border: 2px solid #34495e; }

        /* 모달창 공통 스타일 */
        .modal { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.7); z-index: 20; justify-content: center; align-items: center; }
        .modal-content { background: #2f3640; color: white; padding: 30px; border-radius: 10px; width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 15px; max-height: 80vh; overflow-y: auto; }
        .modal-content h2 { margin: 0 0 10px 0; text-align: center; border-bottom: 1px solid #718093; padding-bottom: 10px; }
        .modal-content button { padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
        
        .upgrade-item { display: flex; justify-content: space-between; align-items: center; background: #353b48; padding: 15px; border-radius: 5px; margin-bottom: 10px; border: 1px solid #718093; }
        .upgrade-btn { background: #2ecc71; color: white; }
        .upgrade-btn:hover { background: #27ae60; }
        .upgrade-btn:disabled { background: #7f8c8d; cursor: not-allowed; }

        #export-btn { background: #3498db; color: white; } #import-btn { background: #2ecc71; color: white; }
        #reset-btn { background: #e74c3c; color: white; margin-top: 20px; } .close-modal-btn { background: #95a5a6; color: white; }
        #import-text { width: 100%; height: 80px; resize: none; border-radius: 5px; padding: 10px; box-sizing: border-box; background: #1e272e; color: #bdc3c7; border: 1px solid #718093; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <button id="settings-btn" class="top-btn">⚙️ 설정</button>
    <button id="upgrades-btn" class="top-btn">🚀 업그레이드</button>
    
    <div id="resource-bar">보유 자원: 없음</div>

    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h2>게임 설정</h2>
            <button id="export-btn">💾 현재 진행상황 TXT로 내보내기</button>
            <textarea id="import-text" placeholder="여기에 텍스트를 붙여넣으세요..."></textarea>
            <button id="import-btn">📂 위 텍스트로 로드하기</button>
            <button id="reset-btn">🗑️ 모든 데이터 초기화</button>
            <button class="close-modal-btn">닫기</button>
        </div>
    </div>

    <div id="upgrades-modal" class="modal">
        <div class="modal-content">
            <h2>연구 / 업그레이드</h2>
            <div id="upgrades-list"></div>
            <button class="close-modal-btn">닫기</button>
        </div>
    </div>

    <div id="ui-layer">
        <button id="toggle-btn">건설 메뉴 ◀</button>
        <div id="sidebar">
            <h3 style="margin-top:0;">건설 탭</h3>
            <div id="build-menu-container"></div>
            <hr style="border-color: #555; margin: 20px 0;">
            <p style="font-size: 13px; color:#dcdde1;">※ 기계를 클릭하여 드래그하면 이동합니다.<br>※ 빈 공간을 드래그해 선을 자를 수 있습니다.</p>
        </div>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
